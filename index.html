<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helmet GPS Tracker · Professional Dashboard</title>
    <!-- Leaflet CSS (load first) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Paste your full CSS here (the same as before) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        :root { --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); --card-bg: white; --text-primary: #2c3e50; --text-secondary: #7f8c8d; --stat-header: #7f8c8d; --stat-value: #2c3e50; --stat-unit: #95a5a6; --border-color: #e0e0e0; --status-bg: white; --status-text: #2c3e50; --button-bg: white; --button-text: #2c3e50; --button-shadow: 0 4px 12px rgba(0,0,0,0.05); --compass-bg: #f0f3f5; --compass-border: #bdc3c7; --badge-bg: #f8f9fa; --badge-text: #2c3e50; --badge-border: #e0e0e0; --badge-active-bg: #d4edda; --badge-active-text: #155724; --badge-active-border: #c3e6cb; --map-bg: #f8f9fa; }
        body.dark-mode { --bg-gradient: linear-gradient(135deg, #1a2639 0%, #0d1b2a 100%); --card-bg: #2d3e5f; --text-primary: #ecf0f1; --text-secondary: #b0c4de; --stat-header: #b0c4de; --stat-value: #ecf0f1; --stat-unit: #8a9fb0; --border-color: #4a5b73; --status-bg: #2d3e5f; --status-text: #ecf0f1; --button-bg: #2d3e5f; --button-text: #ecf0f1; --button-shadow: 0 4px 12px rgba(0,0,0,0.3); --compass-bg: #1e2a3a; --compass-border: #4a5b73; --badge-bg: #1e2a3a; --badge-text: #ecf0f1; --badge-border: #4a5b73; --badge-active-bg: #2c5a3e; --badge-active-text: #b9f6ca; --badge-active-border: #2c5a3e; --map-bg: #1e2a3a; }
        body { background: var(--bg-gradient); min-height: 100vh; padding: 20px; display: flex; align-items: center; justify-content: center; transition: background 0.3s ease; }
        .dashboard { max-width: 1400px; width: 100%; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .title { display: flex; align-items: center; gap: 12px; }
        .title i { font-size: 2.5rem; color: var(--text-primary); }
        .title h1 { font-size: 2rem; font-weight: 600; color: var(--text-primary); letter-spacing: -0.5px; }
        .header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .theme-toggle { background: var(--button-bg); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 40px; font-weight: 600; color: var(--button-text); box-shadow: var(--button-shadow); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; font-size: 0.95rem; }
        .theme-toggle:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.15); }
        .connection-status { display: flex; align-items: center; gap: 8px; background: var(--status-bg); box-shadow: var(--button-shadow); padding: 8px 20px; border-radius: 40px; font-weight: 500; transition: background 0.3s ease; }
        .status-led { width: 12px; height: 12px; border-radius: 50%; background: #f44336; box-shadow: 0 0 8px #f44336; transition: all 0.3s ease; }
        .status-led.connected { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
        .status-text { color: var(--status-text); font-size: 0.95rem; }
        .btn-add-helmet, .btn-emergency { background: var(--button-bg); border: 1px solid var(--border-color); padding: 8px 20px; border-radius: 40px; font-weight: 600; color: var(--button-text); box-shadow: var(--button-shadow); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; font-size: 0.95rem; }
        .btn-add-helmet:hover { background: #e8f0fe; box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
        .btn-add-helmet i { color: #f39c12; }
        .btn-emergency { background: #fee; color: #c0392b; border: 1px solid #e74c3c; }
        .btn-emergency:hover { background: #fdd; }
        .btn-emergency i { color: #e74c3c; }
        .map-card { background: var(--card-bg); border-radius: 32px; padding: 20px; margin-bottom: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); transition: background 0.3s ease, border-color 0.3s ease; border: 1px solid var(--border-color); }
        .map-container { height: 450px; width: 100%; border-radius: 20px; overflow: hidden; border: 2px solid var(--border-color); }
        #map { height: 100%; width: 100%; background: var(--map-bg); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .stat-card { background: var(--card-bg); border-radius: 24px; padding: 22px 18px; transition: all 0.25s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .stat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; color: var(--stat-header); font-size: 0.95rem; letter-spacing: 0.3px; text-transform: uppercase; font-weight: 500; }
        .stat-header i { color: #3498db; font-size: 1.2rem; width: 24px; text-align: center; }
        .stat-value { font-size: 2.1rem; font-weight: 600; color: var(--stat-value); line-height: 1.2; margin-bottom: 4px; font-feature-settings: "tnum"; }
        .stat-unit { font-size: 0.9rem; color: var(--stat-unit); margin-left: 4px; font-weight: 400; }
        .stat-desc { font-size: 0.8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
        .compass-container { display: flex; align-items: center; justify-content: space-between; }
        .compass-arrow { width: 48px; height: 48px; background: var(--compass-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--compass-border); transition: transform 0.3s ease, background 0.3s ease; }
        .compass-arrow i { font-size: 28px; color: #3498db; }
        .satellite-bars { display: flex; align-items: flex-end; gap: 4px; margin-top: 8px; height: 40px; }
        .bar { width: 8px; background: linear-gradient(to top, #3498db, #2980b9); border-radius: 4px 4px 0 0; transition: height 0.3s; }
        .footer { display: flex; align-items: center; justify-content: space-between; color: var(--text-secondary); font-size: 0.9rem; padding: 16px 8px 0; border-top: 1px solid var(--border-color); transition: border-color 0.3s ease; }
        .last-update { display: flex; align-items: center; gap: 8px; }
        .last-update i { color: #3498db; }
        .gps-badge { background: var(--badge-bg); color: var(--badge-text); padding: 6px 16px; border-radius: 40px; font-weight: 500; border: 1px solid var(--badge-border); transition: all 0.3s ease; }
        .gps-badge.active { background: var(--badge-active-bg); color: var(--badge-active-text); border-color: var(--badge-active-border); }
        @media (max-width: 700px) { body { padding: 10px; } .title h1 { font-size: 1.6rem; } .map-container { height: 350px; } .stat-value { font-size: 1.6rem; } }
        .loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 2000; flex-direction: column; gap: 16px; }
        .loading.show { display: flex; }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #3498db; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <div class="title">
                <i class="fas fa-helmet-safety"></i>
                <h1>Helmet GPS Tracker</h1>
            </div>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i> <span>Dark</span>
                </button>
                <button class="btn-add-helmet" id="addHelmetBtn">
                    <i class="fas fa-plus-circle"></i> Add Helmet
                </button>
                <button class="btn-emergency" id="emergencyBtn">
                    <i class="fas fa-exclamation-triangle"></i> Emergency
                </button>
                <div class="connection-status" id="connectionStatus">
                    <span class="status-led" id="statusLed"></span>
                    <span class="status-text" id="statusText">Disconnected</span>
                </div>
            </div>
        </div>
        <div class="map-card">
            <div class="map-container">
                <div id="map"></div>
            </div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-header"><i class="fas fa-map-pin"></i> Latitude</div><div class="stat-value" id="latitude">0.000000</div><div class="stat-desc"><i class="fas fa-arrow-up"></i> °N</div></div>
            <div class="stat-card"><div class="stat-header"><i class="fas fa-map-pin"></i> Longitude</div><div class="stat-value" id="longitude">0.000000</div><div class="stat-desc"><i class="fas fa-arrow-right"></i> °E</div></div>
            <div class="stat-card"><div class="stat-header"><i class="fas fa-mountain"></i> Altitude</div><div class="stat-value" id="altitude">0.0 <span class="stat-unit">m</span></div><div class="stat-desc"><i class="fas fa-water"></i> MSL</div></div>
            <div class="stat-card"><div class="stat-header"><i class="fas fa-gauge-high"></i> Speed</div><div class="stat-value" id="speed">0.0 <span class="stat-unit">km/h</span></div><div class="stat-desc"><i class="fas fa-wind"></i> Ground</div></div>
            <div class="stat-card"><div class="stat-header"><i class="fas fa-compass"></i> Heading</div><div class="compass-container"><div><span class="stat-value" id="heading">0.0<span class="stat-unit">°</span></span></div><div class="compass-arrow" id="compassArrow"><i class="fas fa-location-arrow" style="transform: rotate(0deg);"></i></div></div><div class="stat-desc"><i class="fas fa-circle"></i> True north</div></div>
            <div class="stat-card"><div class="stat-header"><i class="fas fa-satellite-dish"></i> Satellites</div><div class="stat-value" id="satellites">0</div><div class="satellite-bars" id="satBars"></div></div>
        </div>
        <div class="footer">
            <div class="last-update"><i class="fas fa-clock"></i><span>Last update: <span id="lastUpdate">never</span></span></div>
            <div id="gpsFixBadge" class="gps-badge"><i class="fas fa-satellite"></i> Waiting for GPS...</div>
        </div>
    </div>
    <div class="loading" id="loadingOverlay"><div class="spinner"></div><div style="color:white;">Connecting to tracker...</div></div>

    <!-- Firebase SDK (modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==================== FIREBASE CONFIGURATION ====================
        // Replace with your actual Firebase config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const locationsQuery = query(
            collection(db, "locations"),
            orderBy("timestamp", "desc"),
            limit(1)
        );

        // ==================== DASHBOARD GLOBALS ====================
        let map, marker, pathPolyline;
        const pathPoints = [];
        let addedHelmetMarkers = [];
        let emergencyMarkers = [];
        let lastData = null;

        // ==================== THEME TOGGLE ====================
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle?.querySelector('i');
        const themeText = themeToggle?.querySelector('span');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            if (themeIcon) themeIcon.className = 'fas fa-sun';
            if (themeText) themeText.innerText = 'Light';
        } else {
            if (themeIcon) themeIcon.className = 'fas fa-moon';
            if (themeText) themeText.innerText = 'Dark';
        }
        themeToggle?.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            if (isDark) {
                if (themeIcon) themeIcon.className = 'fas fa-sun';
                if (themeText) themeText.innerText = 'Light';
                localStorage.setItem('theme', 'dark');
            } else {
                if (themeIcon) themeIcon.className = 'fas fa-moon';
                if (themeText) themeText.innerText = 'Dark';
                localStorage.setItem('theme', 'light');
            }
        });

        // ==================== LOAD LEAFLET (fallback) ====================
        function loadLeaflet() {
            return new Promise((resolve, reject) => {
                if (typeof L !== 'undefined') {
                    console.log('Leaflet already loaded');
                    resolve();
                    return;
                }
                console.log('Attempting to load Leaflet...');
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
                script.onload = () => {
                    console.log('Leaflet loaded from primary CDN');
                    resolve();
                };
                script.onerror = () => {
                    console.warn('Primary CDN failed, trying fallback...');
                    // Fallback to Cloudflare CDN
                    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
                    script.onload = () => {
                        console.log('Leaflet loaded from fallback CDN');
                        resolve();
                    };
                    script.onerror = () => reject(new Error('All CDNs failed'));
                };
                document.head.appendChild(script);
            });
        }

        // ==================== INIT MAP ====================
        async function initMap() {
            try {
                console.log('Initializing map...');
                const mapContainer = document.getElementById('map');
                if (!mapContainer) {
                    throw new Error('Map container not found');
                }
                await loadLeaflet();
                map = L.map('map', {
                    center: [0, 0],
                    zoom: 18,
                    zoomControl: true,
                    attributionControl: true,
                });

                // Use OpenStreetMap tiles (reliable and free)
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);

                L.control.scale({ imperial: false, metric: true, position: 'bottomleft' }).addTo(map);
                const helmetIcon = L.divIcon({
                    html: '<i class="fas fa-helmet-safety" style="color: #e74c3c; font-size: 32px; filter: drop-shadow(0 0 4px rgba(0,0,0,0.3));"></i>',
                    className: 'custom-marker',
                    iconSize: [32, 32],
                    iconAnchor: [16, 16],
                    popupAnchor: [0, -16]
                });
                marker = L.marker([0, 0], { icon: helmetIcon }).addTo(map);
                marker.bindPopup("<b>Current Helmet Location</b>").openPopup();
                pathPolyline = L.polyline([], { color: '#3498db', weight: 3, opacity: 0.8 }).addTo(map);
                console.log('Map initialized successfully');
            } catch (error) {
                console.error('Map initialization failed:', error);
                document.getElementById('loadingOverlay').classList.remove('show');
                alert('Map could not load. Please check your internet connection and try again.');
            }
        }

        // ==================== UPDATE DASHBOARD ====================
        function updateDashboard(data) {
            document.getElementById('latitude').innerText = data.lat?.toFixed(6) || "0.000000";
            document.getElementById('longitude').innerText = data.lng?.toFixed(6) || "0.000000";
            document.getElementById('altitude').innerHTML = (data.alt || 0).toFixed(1) + ' <span class="stat-unit">m</span>';
            document.getElementById('speed').innerHTML = (data.speed || 0).toFixed(1) + ' <span class="stat-unit">km/h</span>';
            document.getElementById('heading').innerHTML = (data.heading || 0).toFixed(1) + '<span class="stat-unit">°</span>';
            document.getElementById('satellites').innerText = data.satellites || 0;

            const compassArrow = document.querySelector('#compassArrow i');
            if (compassArrow) compassArrow.style.transform = `rotate(${data.heading || 0}deg)`;

            const satBars = document.getElementById('satBars');
            satBars.innerHTML = '';
            const barCount = Math.min(data.satellites || 0, 12);
            for (let i = 0; i < barCount; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = (10 + Math.floor(Math.random() * 30)) + 'px';
                satBars.appendChild(bar);
            }

            if (!document.getElementById('time')) {
                const statsGrid = document.querySelector('.stats-grid');
                const timeCard = document.createElement('div');
                timeCard.className = 'stat-card';
                timeCard.innerHTML = `
                    <div class="stat-header"><i class="fas fa-clock"></i> Time (UTC)</div>
                    <div class="stat-value" id="time">--:--:--</div>
                    <div class="stat-desc"><i class="fas fa-calendar"></i> <span id="date">----/--/--</span></div>
                `;
                statsGrid.appendChild(timeCard);
            } else {
                document.getElementById('time').innerText = data.time || "--:--:--";
                document.getElementById('date').innerText = data.date || "----/--/--";
            }

            document.getElementById('lastUpdate').innerText = new Date().toLocaleTimeString();

            const badge = document.getElementById('gpsFixBadge');
            if (data.valid) {
                badge.className = 'gps-badge active';
                badge.innerHTML = '<i class="fas fa-satellite"></i> 3D Fix · ' + (data.satellites || 0) + ' sats';
            } else {
                badge.className = 'gps-badge';
                badge.innerHTML = '<i class="fas fa-satellite"></i> No Fix';
            }

            if (data.valid && data.lat && data.lng && data.lat !== 0 && data.lng !== 0) {
                const latlng = [data.lat, data.lng];
                marker.setLatLng(latlng);
                map.panTo(latlng);
                pathPoints.push(latlng);
                if (pathPoints.length > 150) pathPoints.shift();
                pathPolyline.setLatLngs(pathPoints);
            }
        }

        // ==================== ADD HELMET MARKER ====================
        function addHelmetMarker() {
            if (!lastData || !lastData.valid) {
                alert('No GPS fix yet. Cannot add marker.');
                return;
            }
            const lat = lastData.lat;
            const lng = lastData.lng;
            const starIcon = L.divIcon({
                html: '<i class="fas fa-star" style="color: #f1c40f; font-size: 28px; filter: drop-shadow(0 0 4px rgba(0,0,0,0.3));"></i>',
                className: 'added-helmet-marker',
                iconSize: [28, 28],
                iconAnchor: [14, 14],
                popupAnchor: [0, -14]
            });
            const addedMarker = L.marker([lat, lng], { icon: starIcon }).addTo(map);
            addedMarker.bindPopup("<b>Helmet added here</b><br>Lat: " + lat.toFixed(6) + "<br>Lng: " + lng.toFixed(6));
            addedHelmetMarkers.push(addedMarker);
        }

        // ==================== ADD EMERGENCY MARKER ====================
        function addEmergencyMarker(lat, lng) {
            if (!document.getElementById('pulseAnim')) {
                const style = document.createElement('style');
                style.id = 'pulseAnim';
                style.innerHTML = '@keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }';
                document.head.appendChild(style);
            }
            const emergencyIcon = L.divIcon({
                html: '<div style="background-color: #e74c3c; width: 20px; height: 20px; border-radius: 50%; animation: pulse 1s infinite; box-shadow: 0 0 10px #e74c3c;"></div>',
                className: 'emergency-marker',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            const emergencyMarker = L.marker([lat, lng], { icon: emergencyIcon }).addTo(map);
            emergencyMarker.bindPopup("<b>🚨 EMERGENCY</b><br>Lat: " + lat.toFixed(6) + "<br>Lng: " + lng.toFixed(6));
            emergencyMarkers.push(emergencyMarker);
        }

        // ==================== TRIGGER EMERGENCY (via local ESP32) ====================
        async function triggerEmergency() {
            const API_BASE = "http://192.168.0.104"; // replace with your ESP32's local IP
            try {
                const response = await fetch(`${API_BASE}/api/emergency`, { method: 'POST' });
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                alert('Emergency triggered successfully!');
                if (lastData && lastData.valid) {
                    addEmergencyMarker(lastData.lat, lastData.lng);
                }
            } catch (err) {
                console.error('Emergency error:', err);
                alert('Failed to trigger emergency. Are you on the same network?');
            }
        }

        // ==================== FIREBASE REAL‑TIME LISTENER ====================
        function listenToLocations() {
            onSnapshot(locationsQuery, (snapshot) => {
                if (snapshot.empty) {
                    console.log("No locations yet.");
                    document.getElementById('statusLed').className = 'status-led';
                    document.getElementById('statusText').innerText = 'No Data';
                    return;
                }
                const doc = snapshot.docs[0];
                const data = doc.data();
                console.log("New location:", data);

                const dashboardData = {
                    lat: data.lat || 0,
                    lng: data.lng || 0,
                    alt: data.alt || 0,
                    speed: data.speed || 0,
                    heading: data.heading || 0,
                    satellites: data.satellites || 0,
                    time: data.time || "--:--:--",
                    date: data.date || "----/--/--",
                    valid: data.valid || false
                };

                document.getElementById('statusLed').className = 'status-led connected';
                document.getElementById('statusText').innerText = 'Connected';
                document.getElementById('loadingOverlay').classList.remove('show');

                updateDashboard(dashboardData);
                lastData = dashboardData;
            }, (error) => {
                console.error("Firestore error:", error);
                document.getElementById('statusLed').className = 'status-led';
                document.getElementById('statusText').innerText = 'Firebase Error';
            });
        }

        // ==================== INIT ====================
        window.addEventListener('load', async () => {
            await initMap();            // wait for map
            listenToLocations();
            document.getElementById('addHelmetBtn').addEventListener('click', addHelmetMarker);
            document.getElementById('emergencyBtn').addEventListener('click', triggerEmergency);
        });
    </script>
</body>
</html>
